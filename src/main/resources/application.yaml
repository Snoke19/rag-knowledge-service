spring:
  application:
    name: rag-knowledge-service
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

management:
  health:
    diskspace:
      enabled: false
    ssl:
      enabled: false
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.example.ragknowledgeservice: DEBUG